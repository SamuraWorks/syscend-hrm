name: release

networks:
  hrnet:
    driver: bridge

volumes:
  mysql_data:
  storage_data:
  public_data:

services:
  # ── MySQL ──────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-syscendhrm}
      MYSQL_USER: ${DB_USERNAME:-syscendhrm}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hrnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── PHP-FPM app (migrations, scheduler, queue) ────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "www-data"
    env_file: .env
    environment:
      DB_HOST: mysql
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.example.com}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-app.example.com}
    volumes:
      - storage_data:/app/storage
      - public_data:/app/public
    networks:
      - hrnet
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        php artisan migrate --force --no-interaction &&
        php artisan config:cache && php artisan route:cache &&
        php-fpm

  # ── Supervisor: queue worker + scheduler ──────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "www-data"
    env_file: .env
    environment:
      DB_HOST: mysql
      QUEUE_CONNECTION: database
    volumes:
      - storage_data:/app/storage
    networks:
      - hrnet
    depends_on:
      mysql:
        condition: service_healthy
    command: ["supervisord", "-c", "deploy/supervisord.conf"]

  # ── Nginx ─────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/app/storage:ro
      - public_data:/app/public:ro
    networks:
      - hrnet
    depends_on:
      - app